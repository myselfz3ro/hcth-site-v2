<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | HCTH</title>
    <!-- Final Production Build: Minimalist / High-Conversion -->
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: #888888;
            --border: #333333;
            --accent: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }
        h1 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
        p { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
        .action-group { display: flex; flex-direction: column; gap: 0.75rem; }
        a {
            display: block;
            padding: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            font-weight: 600;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { border-color: var(--text); }
        .footer { margin-top: 2rem; color: var(--muted); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reservations</h1>
        <p>Book your experience in Costa del Silencio.</p>
        <div class="action-group">
            <a href="https://wa.me/34641114511?text=Hi!%20I%20would%20like%20to%20reserve%20a%20table%20for%20[Number]%20people%20at%20[Time].%20Code:%20Tenerife-Ready." class="btn-primary">Reserve via WhatsApp</a>
            <a href="https://forms.google.com/your-form-id-here" class="btn-secondary" id="form-link">Reserve via Booking Form</a>
        </div>
        <div class="footer">Confirmation sent instantly.</div>
    </div>
    <script>
        // Placeholder handler
        document.getElementById('form-link').addEventListener('click', function(e) {
            if(this.getAttribute('href').includes('your-form-id-here')) {
                e.preventDefault();
                alert('Booking form setup is finalizing. Please use WhatsApp for immediate service.');
            }
        });
    </script>
</body>
</html>
